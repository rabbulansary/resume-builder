<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Student Resume Builder</title>
        <link rel="stylesheet" href="/resumes/editor.css?v=4" />
        <script type="module" src="/resumes/editor.js?v=4"></script>
    </head>
    <body class="min-h-screen bg-slate-100 text-slate-900 antialiased">
        <header class="border-b border-slate-200 bg-white">
            <div class="mx-auto flex max-w-380 flex-wrap items-center justify-between gap-3 px-3 py-3 sm:px-5">
                <div class="flex items-center gap-2.5">
                    <div
                        class="grid size-9 shrink-0 place-items-center rounded-lg bg-indigo-700 text-white"
                        aria-hidden="true"
                    >
                        <svg
                            class="size-5"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.7"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <path d="M7 3h7l5 5v12a1 1 0 0 1-1 1H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z" />
                            <path d="M14 3v6h5M9 13h6m-6 4h6" />
                        </svg>
                    </div>
                    <div>
                        <p class="text-[10px] font-semibold tracking-[0.16em] text-indigo-700 uppercase">
                            Career toolkit
                        </p>
                        <h1 class="text-lg leading-tight font-semibold tracking-tight sm:text-xl">
                            Student resume builder
                        </h1>
                    </div>
                </div>
                <div class="flex flex-wrap items-center gap-1.5" aria-label="Resume file actions">
                    <label
                        class="ui-button relative focus-within:outline-2 focus-within:outline-offset-2 focus-within:outline-indigo-500"
                    >
                        Import JSON
                        <input
                            id="import"
                            class="absolute inset-0 size-full cursor-pointer opacity-0"
                            type="file"
                            accept=".json,application/json"
                        />
                    </label>
                    <button id="download-json" class="ui-button" type="button">Download JSON</button>
                    <button id="print" class="ui-button" type="button" disabled>Open to print</button>
                    <button id="download-pdf" class="ui-button ui-button-primary" type="button" disabled>
                        Download PDF
                    </button>
                </div>
            </div>
        </header>
        <main
            class="mx-auto grid max-w-380 items-start gap-3 px-3 py-3 sm:px-5 lg:grid-cols-[minmax(0,1fr)_minmax(0,0.93fr)] lg:gap-4 lg:py-4"
        >
            <section
                id="editor"
                aria-labelledby="editor-title"
                class="min-w-0 rounded-xl border border-slate-200 bg-white shadow-xs"
            >
                <header class="flex items-center justify-between gap-2 border-b border-slate-200 px-3 py-3 sm:px-4">
                    <div>
                        <h2 id="editor-title" class="text-sm font-semibold">Resume details</h2>
                        <p class="mt-0.5 text-xs text-slate-600">Choose a section to edit.</p>
                    </div>
                    <a href="#preview-pane" class="ui-button lg:hidden">Preview</a>
                </header>
                <div class="grid min-w-0 lg:grid-cols-[8.5rem_minmax(0,1fr)] xl:grid-cols-[10rem_minmax(0,1fr)]">
                    <nav
                        id="section-nav"
                        aria-label="Resume sections"
                        class="flex gap-1 overflow-x-auto border-b border-slate-200 bg-slate-50/80 p-2 lg:flex-col lg:overflow-visible lg:rounded-bl-xl lg:border-r lg:border-b-0"
                    ></nav>
                    <div id="fields" class="min-h-72 min-w-0 p-3 sm:p-4"></div>
                </div>
            </section>
            <section
                id="preview-pane"
                aria-labelledby="preview-title"
                class="min-w-0 rounded-xl border border-slate-200 bg-white shadow-xs lg:sticky lg:top-4"
            >
                <header
                    class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-200 px-3 py-3 sm:px-4"
                >
                    <div>
                        <h2 id="preview-title" class="text-sm font-semibold">Live preview</h2>
                        <p class="mt-0.5 text-xs text-slate-600">A4 portrait</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <p id="fit" class="fit-badge" role="status">Waiting for details</p>
                        <a href="#editor" class="ui-button lg:hidden">Back to editor</a>
                    </div>
                </header>
                <div class="rounded-b-xl bg-slate-100/70 px-3 pt-2.5 pb-3 sm:px-4">
                    <p id="status" class="mb-2.5 text-xs break-words text-slate-700" role="status">
                        Enter your name to start the preview.
                    </p>
                    <div
                        id="validation-warning"
                        class="mb-3 rounded-lg border border-amber-200 bg-amber-50 p-3 text-amber-950"
                        hidden
                    >
                        <div class="flex items-start gap-2.5" role="alert">
                            <div class="grid size-7 shrink-0 place-items-center rounded-md bg-amber-100 text-amber-800">
                                <svg
                                    aria-hidden="true"
                                    class="size-4"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="1.8"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                >
                                    <path
                                        d="M10.3 4.9a2 2 0 0 1 3.4 0l7 12.1a2 2 0 0 1-1.7 3H5a2 2 0 0 1-1.7-3l7-12.1ZM12 9v4m0 3h.01"
                                    />
                                </svg>
                            </div>
                            <div class="min-w-0">
                                <p id="warning-title" class="text-sm font-semibold"></p>
                                <p id="warning-note" class="mt-0.5 text-xs text-amber-900" hidden></p>
                            </div>
                        </div>
                        <ul
                            id="warning-items"
                            class="mt-2 max-h-44 divide-y divide-amber-200 overflow-auto rounded-md border border-amber-200 bg-white/75 empty:hidden"
                        ></ul>
                    </div>
                    <div
                        id="report"
                        class="mb-2.5 max-h-40 space-y-2 overflow-auto rounded-md border border-slate-200 bg-white p-2.5 text-xs break-words"
                        hidden
                    >
                        <ul id="warnings" class="list-inside list-disc space-y-1 text-amber-900 empty:hidden"></ul>
                        <details id="exclusions" hidden>
                            <summary id="exclusion-title" class="cursor-pointer font-semibold">
                                Excluded content
                            </summary>
                            <ol
                                id="excluded-items"
                                class="mt-1.5 list-inside list-decimal space-y-1 text-slate-700"
                            ></ol>
                        </details>
                    </div>
                    <div
                        class="relative mx-auto aspect-210/297 w-full max-w-159 overflow-hidden rounded-sm border border-slate-300 bg-white shadow-sm"
                    >
                        <div
                            id="placeholder"
                            class="absolute inset-0 grid content-center justify-items-center gap-1 px-5 text-center"
                        >
                            <svg
                                aria-hidden="true"
                                class="mb-2 size-8 text-slate-400"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.5"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <path d="M7 3h7l5 5v12a1 1 0 0 1-1 1H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z" />
                                <path d="M14 3v6h5M9 13h6m-6 4h6" />
                            </svg>
                            <p class="text-sm font-semibold text-slate-700">Your resume will appear here</p>
                            <p class="text-xs text-slate-600">The preview updates as you edit.</p>
                        </div>
                        <iframe
                            id="preview"
                            class="absolute inset-0 size-full border-0"
                            title="A4 resume PDF preview"
                            hidden
                        ></iframe>
                    </div>
                </div>
            </section>
        </main>
    </body>
</html>
