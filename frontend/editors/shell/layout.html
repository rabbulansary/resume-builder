<button
    id="edge-pipe-handle"
    type="button"
    class="workspace-handle"
    aria-label="Switch Workspace"
    aria-controls="workspace-backdrop"
    aria-expanded="false"
>
    <span class="workspace-handle-grip" aria-hidden="true"></span>
</button>

<div id="workspace-backdrop" class="workspace-backdrop" inert>
    <nav id="workspace-entities-bar" class="workspace-menu" aria-label="Workspaces">
        <a id="btn-switch-pdf-editor" class="workspace-option" href="/pdf/editor" aria-current="{{pdfCurrent}}">
            <span class="workspace-option-icon">
                <svg class="size-7" aria-hidden="true" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg>
            </span>
            <span class="workspace-option-label">
                PDF Editor &amp; Sign
                <span class="workspace-active">Active</span>
            </span>
        </a>

        <a id="btn-switch-resume-builder" class="workspace-option" href="/resume/editor" aria-current="{{resumeCurrent}}">
            <span class="workspace-option-icon">
                <svg class="size-7" aria-hidden="true" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                </svg>
            </span>
            <span class="workspace-option-label">
                Resume Builder
                <span class="workspace-active">Active</span>
            </span>
        </a>
    </nav>
</div>

<header class="editor-header">
    <div class="flex min-w-0 items-center gap-2">
        <div class="grid size-8 shrink-0 place-items-center rounded-lg bg-indigo-600 text-white shadow-xs" aria-hidden="true">
            <svg class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
            </svg>
        </div>
        <div class="min-w-0">
            <h1 class="text-sm font-bold tracking-tight text-slate-900">{{title}}</h1>
            <p id="doc-meta" class="truncate text-[11px] font-medium text-slate-500">{{subtitle}}</p>
        </div>
    </div>
</header>

<!-- editor-content -->

<footer id="editor-footer" class="editor-footer" aria-label="{{footerLabel}}" {{footerHidden}}>
    {{footerActions}}
</footer>

<div
    id="redirect-confirm-modal"
    class="fixed inset-0 z-50 hidden flex items-center justify-center bg-slate-900/40 p-4 backdrop-blur-xs"
    role="dialog"
    aria-modal="true"
    aria-labelledby="redirect-modal-title"
>
    <div class="w-full max-w-sm rounded-2xl bg-white p-5 shadow-2xl border border-slate-200 animate-in fade-in zoom-in-95 duration-150">
        <div class="flex items-start gap-3">
            <div class="grid size-10 shrink-0 place-items-center rounded-xl bg-amber-100 text-amber-600">
                <svg class="size-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
            </div>
            <div class="min-w-0">
                <h3 id="redirect-modal-title" class="text-sm font-semibold text-slate-900">Switch editors?</h3>
                <p class="mt-1 text-xs text-slate-500 leading-relaxed">
                    Unsaved changes will be lost when you switch editors.
                </p>
            </div>
        </div>
        <div class="mt-5 flex justify-end gap-2 border-t border-slate-100 pt-3">
            <button
                type="button"
                id="btn-cancel-redirect"
                class="rounded-lg border border-slate-200 bg-white px-3 py-1.5 text-xs font-semibold text-slate-700 hover:bg-slate-50 hover:text-slate-900 transition-colors cursor-pointer"
            >
                Cancel
            </button>
            <button
                type="button"
                id="btn-confirm-redirect"
                class="rounded-lg bg-rose-600 px-3.5 py-1.5 text-xs font-semibold text-white shadow-2xs hover:bg-rose-700 transition-colors cursor-pointer"
            >
                Switch editor
            </button>
        </div>
    </div>
</div>

<script type="module" src="/editor-shell/workspace.js"></script>
