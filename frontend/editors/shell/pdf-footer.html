<button
    id="btn-prev-page"
    class="flex size-8 items-center justify-center rounded-xl text-slate-600 hover:bg-slate-100 hover:text-slate-900 transition-colors disabled:opacity-40 disabled:cursor-not-allowed"
    title="Previous Page"
>
    <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
    </svg>
</button>
<span id="page-nav-label" class="min-w-16 text-center text-xs font-semibold text-slate-700 select-none">Page 1 / 1</span>
<button
    id="btn-next-page"
    class="flex size-8 items-center justify-center rounded-xl text-slate-600 hover:bg-slate-100 hover:text-slate-900 transition-colors disabled:opacity-40 disabled:cursor-not-allowed"
    title="Next Page"
>
    <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
    </svg>
</button>

<!-- Divider -->
<span class="mx-0.5 h-4 w-px bg-slate-200"></span>

<!-- Zoom Input Field (Triggered on Enter) -->
<div class="relative flex items-center group" title="Type zoom % and press Enter">
    <input
        id="zoom-input"
        type="text"
        value="100%"
        maxlength="6"
        class="h-7 w-14 rounded-lg border border-slate-200 bg-slate-50/80 px-1 text-center text-xs font-bold text-slate-700 hover:border-slate-300 focus:bg-white focus:border-indigo-500 focus:outline-none transition-colors"
        aria-label="Zoom percentage"
    />
</div>
